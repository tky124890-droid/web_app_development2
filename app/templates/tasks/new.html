{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow mt-4 border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="fas fa-plus-circle"></i> 新增任務</h4>
            </div>
            <div class="card-body p-4 bg-light">
                <form action="{{ url_for('tasks.create_task') }}" method="POST">
                    <div class="mb-4">
                        <label for="title" class="form-label fw-bold">任務標題 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title" required autofocus placeholder="請輸入任務名稱...">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label for="priority" class="form-label fw-bold">優先級</label>
                            <select class="form-select" id="priority" name="priority">
                                <option value="高">高 (High)</option>
                                <option value="中" selected>中 (Medium)</option>
                                <option value="低">低 (Low)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="due_date" class="form-label fw-bold">截止日期</label>
                            <input type="date" class="form-control" id="due_date" name="due_date">
                        </div>
                    </div>

                    <div class="mb-5">
                        <label for="tags" class="form-label fw-bold">標籤 (Tags)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-tags"></i></span>
                            <input type="text" class="form-control" id="tags" name="tags" placeholder="例如：工作, 急件 (多個請用逗號分隔)">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('tasks.index') }}" class="btn btn-outline-secondary px-4"><i class="fas fa-arrow-left"></i> 取消返回</a>
                        <button type="submit" class="btn btn-primary px-5"><i class="fas fa-save"></i> 儲存任務</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
