{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow mt-4 border-0">
            <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fas fa-edit"></i> 編輯任務</h4>
                <span class="badge bg-light text-primary">#{{ task.id }}</span>
            </div>
            <div class="card-body p-4 bg-light">
                <form action="{{ url_for('tasks.update_task', id=task.id) }}" method="POST">
                    <div class="mb-4">
                        <label for="title" class="form-label fw-bold">任務標題 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title" value="{{ task.title }}" required autofocus>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label for="priority" class="form-label fw-bold">優先級</label>
                            <select class="form-select" id="priority" name="priority">
                                <option value="高" {% if task.priority == '高' %}selected{% endif %}>高 (High)</option>
                                <option value="中" {% if task.priority == '中' %}selected{% endif %}>中 (Medium)</option>
                                <option value="低" {% if task.priority == '低' %}selected{% endif %}>低 (Low)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="due_date" class="form-label fw-bold">截止日期</label>
                            <input type="date" class="form-control" id="due_date" name="due_date" value="{{ task.due_date if task.due_date else '' }}">
                        </div>
                    </div>

                    <div class="mb-5">
                        <label for="tags" class="form-label fw-bold">標籤 (Tags)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-tags"></i></span>
                            <input type="text" class="form-control" id="tags" name="tags" value="{{ task.tags }}" placeholder="例如：工作, 急件 (多個請用逗號分隔)">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('tasks.index') }}" class="btn btn-outline-secondary px-4"><i class="fas fa-arrow-left"></i> 取消返回</a>
                        <button type="submit" class="btn btn-primary px-5"><i class="fas fa-save"></i> 更新任務</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
